[project]
name = "DOAI"
version = "0.1.0"
description = "Un agent IA autonome pour l'analyse de documents, l'extraction d'informations et la génération de rapports spécialisée pour la douane béninoise"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.140.13",
    "ipykernel>=7.3.0",
    "langchain-community>=0.4.2",
    "llama-cloud>=2.13.0",
    "llama-index-llms-openai>=0.7.10",
    "matplotlib>=3.11.1",
    "pinecone>=9.1.0",
    "plotly>=6.9.0",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
    "seaborn>=0.13.2",
    "sentence-transformers>=5.6.1",
    "streamlit>=1.60.0",
    "torch>=2.13.0",
    "transformers>=5.14.1",
    "uvicorn>=0.51.0",
    "tavily-python>=0.4.4",
    "tavily>=1.1.0",
    "langchain-huggingface>=1.2.2",
    "ragas>=0.4.3",
    "marker-pdf",
    "pdfplumber",
    "python-docx",
]


